name: ci
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - run: pnpm i
      - run: docker compose up -d db mosquitto minio
      - run: pnpm -w build || true
      - run: pnpm -w test || true
