services:
  db:
    image: timescale/timescaledb:2.16.0-pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: atek
    ports: ["5432:5432"]
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes:
      - ./local/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data

  mailhog:
    image: mailhog/mailhog
    ports: ["1025:1025", "8025:8025"]

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.4
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    volumes:
      - ./local/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8080:8080"

  api:
    build: { context: ./apps/api, dockerfile: Dockerfile }
    env_file: [.env.example]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/atek
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      AUTH_JWKS_URL: http://keycloak:8080/realms/atek/protocol/openid-connect/certs
      AUTH_ISSUER_URL: http://keycloak:8080/realms/atek
      AUTH_AUDIENCE: atek-api
    depends_on: [db, mosquitto, minio, keycloak]
    ports: ["3001:3001"]

  web:
    build: { context: ./apps/web, dockerfile: Dockerfile }
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_AUTH_ISSUER: http://localhost:8080/realms/atek
      NEXT_PUBLIC_AUTH_CLIENT_ID: atek-web
    depends_on: [api, keycloak]
    ports: ["3000:3000"]

  ingestor:
    build: { context: ./local/ingestor }
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/atek
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123
      MQTT_BROKER_URL: mqtt://mosquitto:1883
    depends_on: [db, mosquitto, minio]

volumes:
  dbdata:
  miniodata:
